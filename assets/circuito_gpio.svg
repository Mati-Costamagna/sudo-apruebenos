<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="sans-serif" font-size="12">

  <rect width="800" height="480" fill="#f8f9fa" rx="8"/>
  <text x="400" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#212529">Circuito — BeagleBone Black + generador de pulsos (entrada GPIO)</text>

  <!-- ══════════ BBB ══════════ -->
  <rect x="540" y="55" width="220" height="330" fill="#dee2e6" stroke="#495057" stroke-width="2" rx="6"/>
  <text x="650" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#212529">BeagleBone Black</text>

  <!-- P9_12 GPIO1[28] -->
  <rect x="540" y="110" width="18" height="18" fill="#20c997" stroke="#333" stroke-width="1" rx="2"/>
  <text x="563" y="123" font-size="11" fill="#212529">P9_12  GPIO1[28]</text>

  <!-- P9_1 GND (canal 0) -->
  <rect x="540" y="170" width="18" height="18" fill="#6c757d" stroke="#333" stroke-width="1" rx="2"/>
  <text x="563" y="183" font-size="11" fill="#212529">P9_1   GND</text>

  <!-- P9_14 GPIO1[18] -->
  <rect x="540" y="265" width="18" height="18" fill="#20c997" stroke="#333" stroke-width="1" rx="2"/>
  <text x="563" y="278" font-size="11" fill="#212529">P9_14  GPIO1[18]</text>

  <!-- P9_2 GND (canal 1) -->
  <rect x="540" y="325" width="18" height="18" fill="#6c757d" stroke="#333" stroke-width="1" rx="2"/>
  <text x="563" y="338" font-size="11" fill="#212529">P9_2   GND</text>

  <!-- ══════════ CANAL 0 ══════════ -->
  <text x="55" y="80" font-size="12" font-weight="bold" fill="#147c4a">Canal 0 — P9_12 (GPIO1[28])</text>

  <rect x="60" y="95" width="110" height="60" fill="#fff3cd" stroke="#856404" stroke-width="2" rx="4"/>
  <text x="115" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#856404">Generador</text>
  <text x="115" y="137" text-anchor="middle" font-size="10" fill="#856404">de pulsos</text>

  <!-- Señal generador → nodo -->
  <line x1="170" y1="119" x2="290" y2="119" stroke="#20c997" stroke-width="2"/>
  <circle cx="290" cy="119" r="5" fill="#212529"/>
  <text x="278" y="110" font-size="10" fill="#212529">nodo</text>

  <!-- Nodo → P9_12 -->
  <line x1="290" y1="119" x2="540" y2="119" stroke="#20c997" stroke-width="2"/>

  <!-- Nodo → R pull-down → GND -->
  <rect x="280" y="140" width="20" height="50" fill="#fff" stroke="#343a40" stroke-width="2" rx="3"/>
  <text x="305" y="160" font-size="10" fill="#343a40">10kΩ</text>
  <text x="305" y="174" font-size="9"  fill="#6c757d">pull-down</text>
  <line x1="290" y1="119" x2="290" y2="140" stroke="#343a40" stroke-width="2"/>
  <line x1="290" y1="190" x2="290" y2="179" stroke="#6c757d" stroke-width="2"/>
  <line x1="290" y1="179" x2="290" y2="179" stroke="#6c757d" stroke-width="2"/>
  <line x1="290" y1="190" x2="490" y2="190" stroke="#6c757d" stroke-width="2" stroke-dasharray="5"/>
  <line x1="490" y1="190" x2="490" y2="179" stroke="#6c757d" stroke-width="2" stroke-dasharray="5"/>
  <line x1="490" y1="179" x2="540" y2="179" stroke="#6c757d" stroke-width="2" stroke-dasharray="5"/>

  <!-- ══════════ CANAL 1 ══════════ -->
  <text x="55" y="240" font-size="12" font-weight="bold" fill="#084298">Canal 1 — P9_14 (GPIO1[18])</text>

  <rect x="60" y="255" width="110" height="60" fill="#fff3cd" stroke="#856404" stroke-width="2" rx="4"/>
  <text x="115" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#856404">Generador</text>
  <text x="115" y="297" text-anchor="middle" font-size="10" fill="#856404">de pulsos</text>

  <line x1="170" y1="279" x2="290" y2="279" stroke="#20c997" stroke-width="2"/>
  <circle cx="290" cy="279" r="5" fill="#212529"/>
  <text x="278" y="270" font-size="10" fill="#212529">nodo</text>
  <line x1="290" y1="279" x2="540" y2="279" stroke="#20c997" stroke-width="2"/>

  <rect x="280" y="300" width="20" height="50" fill="#fff" stroke="#343a40" stroke-width="2" rx="3"/>
  <text x="305" y="320" font-size="10" fill="#343a40">10kΩ</text>
  <text x="305" y="334" font-size="9"  fill="#6c757d">pull-down</text>
  <line x1="290" y1="279" x2="290" y2="300" stroke="#343a40" stroke-width="2"/>
  <line x1="290" y1="350" x2="290" y2="334" stroke="#6c757d" stroke-width="2"/>
  <line x1="290" y1="350" x2="490" y2="350" stroke="#6c757d" stroke-width="2" stroke-dasharray="5"/>
  <line x1="490" y1="350" x2="490" y2="334" stroke="#6c757d" stroke-width="2" stroke-dasharray="5"/>
  <line x1="490" y1="334" x2="540" y2="334" stroke="#6c757d" stroke-width="2" stroke-dasharray="5"/>

  <!-- ══════════ LEYENDA ══════════ -->
  <rect x="30" y="400" width="740" height="62" fill="#e9ecef" rx="4" stroke="#ced4da" stroke-width="1"/>
  <text x="400" y="418" text-anchor="middle" font-size="11" font-weight="bold" fill="#212529">Leyenda</text>
  <circle cx="55"  cy="433" r="5" fill="#20c997"/><text x="65"  y="437" font-size="11" fill="#212529">Señal → pin GPIO (entrada)</text>
  <circle cx="290" cy="433" r="5" fill="#6c757d"/><text x="300" y="437" font-size="11" fill="#212529">GND</text>
  <text x="55" y="453" font-size="10" fill="#6c757d">
    ⚠ Tensión máx en pines GPIO del AM335x: 3.3 V.  El pull-down 10kΩ fija un 0 definido cuando el generador está en alta impedancia.
  </text>
</svg>
