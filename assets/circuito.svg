<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="sans-serif" font-size="12">

  <rect width="800" height="560" fill="#f8f9fa" rx="8"/>
  <text x="400" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#212529">Circuito — BeagleBone Black + LM35 + LDR</text>

  <!-- ══════════ BBB ══════════ -->
  <rect x="540" y="55" width="220" height="410" fill="#dee2e6" stroke="#495057" stroke-width="2" rx="6"/>
  <text x="650" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#212529">BeagleBone Black</text>

  <!-- Pin P9.07 SYS_5V -->
  <rect x="540" y="95"  width="18" height="18" fill="#fd7e14" stroke="#333" stroke-width="1" rx="2"/>
  <text x="563" y="108" font-size="11" fill="#212529">P9.07  SYS_5V</text>

  <!-- Pin P9.39 AIN0 -->
  <rect x="540" y="145" width="18" height="18" fill="#20c997" stroke="#333" stroke-width="1" rx="2"/>
  <text x="563" y="158" font-size="11" fill="#212529">P9.39  AIN0</text>

  <!-- Pin P9.34 GNDA (canal 0) -->
  <rect x="540" y="195" width="18" height="18" fill="#6c757d" stroke="#333" stroke-width="1" rx="2"/>
  <text x="563" y="208" font-size="11" fill="#212529">P9.34  GNDA</text>

  <!-- Pin P9.03 3.3V -->
  <rect x="540" y="310" width="18" height="18" fill="#0d6efd" stroke="#333" stroke-width="1" rx="2"/>
  <text x="563" y="323" font-size="11" fill="#212529">P9.03  3.3V</text>

  <!-- Pin P9.40 AIN1 -->
  <rect x="540" y="360" width="18" height="18" fill="#20c997" stroke="#333" stroke-width="1" rx="2"/>
  <text x="563" y="373" font-size="11" fill="#212529">P9.40  AIN1</text>

  <!-- Pin P9.34 GNDA (canal 1) -->
  <rect x="540" y="410" width="18" height="18" fill="#6c757d" stroke="#333" stroke-width="1" rx="2"/>
  <text x="563" y="423" font-size="11" fill="#212529">P9.34  GNDA</text>

  <!-- ══════════ CANAL 0 — LM35 ══════════ -->
  <text x="55" y="75" font-size="12" font-weight="bold" fill="#c0392b">Canal 0 — LM35 (Temperatura)</text>

  <!-- LM35 componente -->
  <rect x="70" y="95" width="90" height="65" fill="#fff3cd" stroke="#856404" stroke-width="2" rx="4"/>
  <text x="115" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#856404">LM35</text>
  <text x="115" y="136" text-anchor="middle" font-size="10" fill="#856404">10 mV/°C</text>
  <!-- Etiquetas pines LM35 -->
  <text x="55"  y="107" font-size="10" fill="#fd7e14">VCC</text>
  <text x="163" y="136" font-size="10" fill="#20c997">VOUT</text>
  <text x="55"  y="153" font-size="10" fill="#6c757d">GND</text>

  <!-- VCC (pin izq arriba) -->
  <line x1="70"  y1="104" x2="45"  y2="104" stroke="#fd7e14" stroke-width="2"/>
  <!-- VCC → sube a y=48, cruza a x=520, baja a P9.07 -->
  <line x1="45"  y1="104" x2="45"  y2="48"  stroke="#fd7e14" stroke-width="2" stroke-dasharray="5"/>
  <line x1="45"  y1="48"  x2="520" y2="48"  stroke="#fd7e14" stroke-width="2" stroke-dasharray="5"/>
  <line x1="520" y1="48"  x2="520" y2="104" stroke="#fd7e14" stroke-width="2" stroke-dasharray="5"/>
  <line x1="520" y1="104" x2="540" y2="104" stroke="#fd7e14" stroke-width="2"/>

  <!-- VOUT (pin der centro) → AIN0 directo -->
  <line x1="160" y1="130" x2="510" y2="130" stroke="#20c997" stroke-width="2"/>
  <line x1="510" y1="130" x2="510" y2="154" stroke="#20c997" stroke-width="2"/>
  <line x1="510" y1="154" x2="540" y2="154" stroke="#20c997" stroke-width="2"/>

  <!-- GND (pin izq abajo) → GNDA -->
  <line x1="70"  y1="148" x2="45"  y2="148" stroke="#6c757d" stroke-width="2"/>
  <line x1="45"  y1="148" x2="45"  y2="204" stroke="#6c757d" stroke-width="2" stroke-dasharray="5"/>
  <line x1="45"  y1="204" x2="540" y2="204" stroke="#6c757d" stroke-width="2" stroke-dasharray="5"/>

  <!-- ══════════ CANAL 1 — LDR ══════════ -->
  <text x="55" y="285" font-size="12" font-weight="bold" fill="#084298">Canal 1 — LDR (Luz)</text>

  <!--
    Divisor correcto:
      3.3V (P9.03) ──── LDR ──── NODO ──── R(10kΩ) ──── GNDA (P9.34)
                                   │
                                 AIN1 (P9.40)
  -->

  <!-- 3.3V desde P9.03 → llega a x=80, y=319 (izq del LDR) -->
  <line x1="540" y1="319" x2="500" y2="319" stroke="#0d6efd" stroke-width="2"/>
  <line x1="500" y1="319" x2="500" y2="270" stroke="#0d6efd" stroke-width="2" stroke-dasharray="5"/>
  <line x1="500" y1="270" x2="80"  y2="270" stroke="#0d6efd" stroke-width="2" stroke-dasharray="5"/>
  <line x1="80"  y1="270" x2="80"  y2="319" stroke="#0d6efd" stroke-width="2"/>

  <!-- LDR (horizontal entre x=80 y x=200, centrado en y=319) -->
  <rect x="80" y="305" width="120" height="28" fill="#cfe2ff" stroke="#084298" stroke-width="2" rx="4"/>
  <text x="140" y="316" text-anchor="middle" font-size="11" font-weight="bold" fill="#084298">LDR</text>
  <text x="140" y="328" text-anchor="middle" font-size="9"  fill="#084298">~1kΩ – 1MΩ</text>

  <!-- Nodo (extremo derecho del LDR) -->
  <circle cx="260" cy="319" r="5" fill="#212529"/>
  <line x1="200" y1="319" x2="260" y2="319" stroke="#212529" stroke-width="2"/>

  <!-- Nodo → R(10kΩ) → GNDA (vertical hacia abajo) -->
  <!-- Resistor: rect vertical centrado en x=260 -->
  <rect x="250" y="340" width="20" height="50" fill="#fff" stroke="#343a40" stroke-width="2" rx="3"/>
  <text x="275" y="358" font-size="10" fill="#343a40">10kΩ</text>
  <text x="275" y="372" font-size="9"  fill="#6c757d">R fija</text>
  <!-- Nodo → top resistor -->
  <line x1="260" y1="319" x2="260" y2="340" stroke="#343a40" stroke-width="2"/>
  <!-- Bottom resistor → y=419 → GNDA -->
  <line x1="260" y1="390" x2="260" y2="419" stroke="#6c757d" stroke-width="2" stroke-dasharray="5"/>
  <line x1="260" y1="419" x2="540" y2="419" stroke="#6c757d" stroke-width="2" stroke-dasharray="5"/>

  <!-- Nodo → AIN1 (horizontal hacia la derecha) -->
  <line x1="260" y1="319" x2="260" y2="310" stroke="#20c997" stroke-width="2"/>
  <line x1="260" y1="310" x2="490" y2="310" stroke="#20c997" stroke-width="2"/>
  <line x1="490" y1="310" x2="490" y2="369" stroke="#20c997" stroke-width="2"/>
  <line x1="490" y1="369" x2="540" y2="369" stroke="#20c997" stroke-width="2"/>

  <!-- Etiquetas divisor -->
  <text x="35"  y="316" font-size="10" fill="#0d6efd">3.3V</text>
  <text x="208" y="313" font-size="10" fill="#212529">nodo</text>

  <!-- ══════════ LEYENDA ══════════ -->
  <rect x="30" y="470" width="740" height="72" fill="#e9ecef" rx="4" stroke="#ced4da" stroke-width="1"/>
  <text x="400" y="488" text-anchor="middle" font-size="11" font-weight="bold" fill="#212529">Leyenda</text>
  <circle cx="55"  cy="503" r="5" fill="#fd7e14"/><text x="65"  y="507" font-size="11" fill="#212529">5V (SYS_5V)</text>
  <circle cx="175" cy="503" r="5" fill="#20c997"/><text x="185" y="507" font-size="11" fill="#212529">Señal → AIN</text>
  <circle cx="290" cy="503" r="5" fill="#6c757d"/><text x="300" y="507" font-size="11" fill="#212529">Masa analógica</text>
  <circle cx="430" cy="503" r="5" fill="#0d6efd"/><text x="440" y="507" font-size="11" fill="#212529">3.3V</text>
  <text x="55" y="528" font-size="10" fill="#6c757d">
    ⚠ LM35: VOUT máx ~1.5V a 150°C → sin divisor necesario  |  LDR: divisor 10kΩ asegura V_AIN ≤ 1.65V
  </text>

</svg>
