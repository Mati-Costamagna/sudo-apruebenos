<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="sans-serif" font-size="12">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#495057"/>
    </marker>
  </defs>

  <rect width="860" height="420" fill="#f8f9fa" rx="8"/>
  <text x="430" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#212529">Cross-compilación — PC (x86_64) → BeagleBone Black (ARM)</text>

  <!-- ══════════ PC (HOST x86_64) ══════════ -->
  <rect x="20" y="50" width="430" height="340" fill="#d1e7dd" stroke="#146c43" stroke-width="2" rx="6"/>
  <text x="38" y="70" font-size="11" font-weight="bold" fill="#146c43">PC anfitriona — x86_64</text>

  <!-- Editor / fuente -->
  <rect x="45" y="82" width="180" height="60" fill="#fff" stroke="#146c43" stroke-width="1.5" rx="4"/>
  <text x="135" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#146c43">gpio_cdd.c</text>
  <text x="135" y="122" text-anchor="middle" font-size="9" fill="#6c757d">editado en VSCodium</text>

  <!-- Toolchain -->
  <rect x="45" y="172" width="360" height="92" fill="#0f5132" stroke="#0a3622" stroke-width="1.5" rx="4"/>
  <text x="225" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">arm-linux-gnueabihf-gcc</text>
  <text x="225" y="214" text-anchor="middle" font-size="10" fill="#d1e7dd">Kbuild:  ARCH=arm  CROSS_COMPILE=arm-linux-gnueabihf-</text>
  <text x="225" y="232" text-anchor="middle" font-size="9" fill="#d1e7dd">CC → target ARM   |   HOSTCC = gcc x86_64 (modpost, etc.)</text>
  <text x="225" y="250" text-anchor="middle" font-size="9" fill="#ffe69c">⚠ modpost recompilado para el host (era binario ARM)</text>

  <!-- Headers BBB -->
  <rect x="245" y="82" width="160" height="60" fill="#fff" stroke="#146c43" stroke-width="1.5" rx="4"/>
  <text x="325" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#146c43">headers del kernel</text>
  <text x="325" y="122" text-anchor="middle" font-size="9" fill="#6c757d">5.10.168-ti-r61 (de la BBB)</text>

  <!-- .ko resultante -->
  <rect x="105" y="300" width="240" height="68" fill="#198754" stroke="#0a3622" stroke-width="1.5" rx="4"/>
  <text x="225" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">gpio_cdd.ko</text>
  <text x="225" y="340" text-anchor="middle" font-size="9" fill="#d1e7dd">ELF 32-bit LSB relocatable, ARM</text>
  <text x="225" y="356" text-anchor="middle" font-size="9" fill="#d1e7dd">verificado con: file gpio_cdd.ko</text>

  <!-- flechas internas PC -->
  <line x1="135" y1="142" x2="135" y2="172" stroke="#146c43" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="325" y1="142" x2="325" y2="172" stroke="#146c43" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="225" y1="264" x2="225" y2="300" stroke="#146c43" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ══════════ BBB (TARGET ARM) ══════════ -->
  <rect x="540" y="50" width="300" height="340" fill="#cfe2ff" stroke="#084298" stroke-width="2" rx="6"/>
  <text x="558" y="70" font-size="11" font-weight="bold" fill="#084298">BeagleBone Black — ARM Cortex-A8</text>

  <rect x="575" y="172" width="230" height="62" fill="#0a58ca" stroke="#042080" stroke-width="1.5" rx="4"/>
  <text x="690" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">sudo insmod gpio_cdd.ko</text>
  <text x="690" y="216" text-anchor="middle" font-size="9" fill="#cfe2ff">el kernel resuelve símbolos al cargar</text>

  <rect x="575" y="300" width="230" height="62" fill="#fff" stroke="#084298" stroke-width="1.5" rx="4"/>
  <text x="690" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#084298">/dev/SdC_gpio</text>
  <text x="690" y="342" text-anchor="middle" font-size="9" fill="#6c757d">major dinámico · creado por udev</text>

  <line x1="690" y1="234" x2="690" y2="300" stroke="#084298" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- scp .ko de PC → BBB -->
  <line x1="345" y1="334" x2="490" y2="334" stroke="#495057" stroke-width="2" stroke-dasharray="6"/>
  <line x1="490" y1="334" x2="490" y2="203" stroke="#495057" stroke-width="2" stroke-dasharray="6"/>
  <line x1="490" y1="203" x2="575" y2="203" stroke="#495057" stroke-width="2" stroke-dasharray="6" marker-end="url(#a)"/>
  <text x="500" y="270" text-anchor="middle" font-size="10" font-weight="bold" fill="#495057">scp gpio_cdd.ko</text>
  <text x="500" y="285" text-anchor="middle" font-size="9" fill="#6c757d">make deploy</text>
</svg>
