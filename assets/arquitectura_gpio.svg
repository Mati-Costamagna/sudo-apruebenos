<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" font-family="sans-serif" font-size="12">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#495057"/>
    </marker>
  </defs>

  <rect width="860" height="620" fill="#f8f9fa" rx="8"/>
  <text x="430" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#212529">Arquitectura del sistema — gpio_cdd (GPIO mapeado en memoria)</text>

  <!-- ══════════ CAPA HARDWARE ══════════ -->
  <rect x="20" y="45" width="820" height="115" fill="#fff3cd" stroke="#856404" stroke-width="2" rx="6"/>
  <text x="38" y="63" font-size="11" font-weight="bold" fill="#856404">Hardware — AM335x</text>

  <!-- Generador canal 0 -->
  <rect x="50" y="72" width="170" height="68" fill="#fffbe6" stroke="#856404" stroke-width="1.5" rx="4"/>
  <text x="135" y="93"  text-anchor="middle" font-size="11" font-weight="bold" fill="#856404">Generador de pulsos</text>
  <text x="135" y="109" text-anchor="middle" font-size="10" fill="#6c757d">canal 0 → P9_12</text>
  <text x="135" y="124" text-anchor="middle" font-size="10" fill="#6c757d">GPIO1[28]</text>

  <!-- Generador canal 1 -->
  <rect x="245" y="72" width="170" height="68" fill="#fffbe6" stroke="#856404" stroke-width="1.5" rx="4"/>
  <text x="330" y="93"  text-anchor="middle" font-size="11" font-weight="bold" fill="#856404">Generador de pulsos</text>
  <text x="330" y="109" text-anchor="middle" font-size="10" fill="#6c757d">canal 1 → P9_14</text>
  <text x="330" y="124" text-anchor="middle" font-size="10" fill="#6c757d">GPIO1[18]</text>

  <!-- Banco GPIO1 -->
  <rect x="510" y="67" width="300" height="78" fill="#fd7e14" stroke="#7c3d08" stroke-width="1.5" rx="4"/>
  <text x="660" y="93"  text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Banco GPIO1 — base 0x4804C000</text>
  <text x="660" y="110" text-anchor="middle" font-size="10" fill="#ffe">registros físicos del SoC</text>
  <text x="660" y="126" text-anchor="middle" font-size="10" fill="#ffe">máx 3.3 V por pin</text>

  <line x1="220" y1="100" x2="510" y2="100" stroke="#856404" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="415" y1="115" x2="510" y2="115" stroke="#856404" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ══════════ CAPA KERNEL ══════════ -->
  <rect x="20" y="182" width="820" height="218" fill="#cfe2ff" stroke="#084298" stroke-width="2" rx="6"/>
  <text x="38" y="200" font-size="11" font-weight="bold" fill="#084298">Kernel Space</text>

  <!-- ioremap / registros -->
  <rect x="45"  y="212" width="210" height="70" fill="#fff" stroke="#084298" stroke-width="1.5" rx="4"/>
  <text x="150" y="233" text-anchor="middle" font-size="11" font-weight="bold" fill="#084298">ioremap()</text>
  <text x="150" y="249" text-anchor="middle" font-size="9"  fill="#6c757d">GPIO_OE (0x134) = entrada</text>
  <text x="150" y="264" text-anchor="middle" font-size="9"  fill="#6c757d">readl(GPIO_DATAIN 0x138)</text>

  <!-- timer -->
  <rect x="305" y="212" width="195" height="70" fill="#fff" stroke="#084298" stroke-width="1.5" rx="4"/>
  <text x="402" y="233" text-anchor="middle" font-size="11" font-weight="bold" fill="#084298">sampling_timer</text>
  <text x="402" y="249" text-anchor="middle" font-size="9"  fill="#6c757d">mod_timer cada sample_ms</text>
  <text x="402" y="264" text-anchor="middle" font-size="9"  fill="#6c757d">default 100 ms (no es RT)</text>

  <!-- pin_states -->
  <rect x="552" y="212" width="255" height="70" fill="#fff" stroke="#084298" stroke-width="1.5" rx="4"/>
  <text x="679" y="233" text-anchor="middle" font-size="11" font-weight="bold" fill="#084298">pin_states[2]</text>
  <text x="679" y="249" text-anchor="middle" font-size="9"  fill="#6c757d">nivel lógico 0 / 1</text>
  <text x="679" y="264" text-anchor="middle" font-size="9"  fill="#6c757d">spinlock protegido</text>

  <line x1="255" y1="247" x2="305" y2="247" stroke="#084298" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="500" y1="247" x2="552" y2="247" stroke="#084298" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- file_operations -->
  <rect x="130" y="320" width="280" height="62" fill="#084298" stroke="#042080" stroke-width="1.5" rx="4"/>
  <text x="270" y="342" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">gpio_cdd — file_operations</text>
  <text x="270" y="358" text-anchor="middle" font-size="9"  fill="#cfe2ff">open / read / write / release</text>
  <text x="270" y="372" text-anchor="middle" font-size="9"  fill="#cfe2ff">copy_to_user / copy_from_user</text>

  <!-- /dev/SdC_gpio -->
  <rect x="470" y="320" width="280" height="62" fill="#0a58ca" stroke="#042080" stroke-width="1.5" rx="4"/>
  <text x="610" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">/dev/SdC_gpio</text>
  <text x="610" y="358" text-anchor="middle" font-size="9"  fill="#cfe2ff">major:minor dinámico</text>
  <text x="610" y="372" text-anchor="middle" font-size="9"  fill="#cfe2ff">write("0"/"1") selecciona canal</text>

  <line x1="679" y1="282" x2="679" y2="303" stroke="#084298" stroke-width="1.5"/>
  <line x1="679" y1="303" x2="270" y2="303" stroke="#084298" stroke-width="1.5"/>
  <line x1="270" y1="303" x2="270" y2="320" stroke="#084298" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="410" y1="351" x2="470" y2="351" stroke="#084298" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- registros → ioremap (inter-capa) -->
  <line x1="150" y1="160" x2="150" y2="212" stroke="#856404" stroke-width="1.5" stroke-dasharray="5" marker-end="url(#a)"/>
  <text x="155" y="190" font-size="9" fill="#856404">mem-mapped I/O</text>

  <!-- ══════════ CAPA USER SPACE ══════════ -->
  <rect x="20" y="425" width="820" height="172" fill="#d1e7dd" stroke="#146c43" stroke-width="2" rx="6"/>
  <text x="38" y="443" font-size="11" font-weight="bold" fill="#146c43">User Space</text>

  <!-- signal_server en la BBB -->
  <rect x="45" y="455" width="250" height="122" fill="#fff" stroke="#146c43" stroke-width="1.5" rx="4"/>
  <text x="170" y="476" text-anchor="middle" font-size="11" font-weight="bold" fill="#146c43">signal_server.py  (en la BBB)</text>
  <text x="170" y="494" text-anchor="middle" font-size="9"  fill="#6c757d">hilo: lee /dev/SdC_gpio cada interval</text>
  <text x="170" y="510" text-anchor="middle" font-size="9"  fill="#6c757d">buffers circulares (300 puntos)</text>
  <text x="170" y="526" text-anchor="middle" font-size="9"  fill="#6c757d">servidor HTTP en :8080</text>
  <text x="170" y="542" text-anchor="middle" font-size="9"  fill="#6c757d">/data → JSON de ambos canales</text>

  <!-- HTTP -->
  <rect x="355" y="475" width="150" height="80" fill="#146c43" stroke="#0a3622" stroke-width="1.5" rx="4"/>
  <text x="430" y="501" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">HTTP :8080</text>
  <text x="430" y="517" text-anchor="middle" font-size="9"  fill="#d1e7dd">polling /data c/200 ms</text>
  <text x="430" y="531" text-anchor="middle" font-size="9"  fill="#d1e7dd">10.42.0.228</text>

  <!-- navegador PC -->
  <rect x="565" y="455" width="250" height="122" fill="#fff" stroke="#146c43" stroke-width="1.5" rx="4"/>
  <text x="690" y="476" text-anchor="middle" font-size="11" font-weight="bold" fill="#146c43">Navegador — PC</text>
  <text x="690" y="494" text-anchor="middle" font-size="9"  fill="#6c757d">Chart.js, tiempo real</text>
  <text x="690" y="510" text-anchor="middle" font-size="9"  fill="#6c757d">modo stepped (señal digital)</text>
  <text x="690" y="526" text-anchor="middle" font-size="9"  fill="#6c757d">botones: canal 0 / canal 1</text>
  <text x="690" y="542" text-anchor="middle" font-size="9"  fill="#6c757d">HIGH (1) / LOW (0)</text>

  <line x1="295" y1="515" x2="355" y2="515" stroke="#146c43" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="505" y1="515" x2="565" y2="515" stroke="#146c43" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- /dev/SdC_gpio → signal_server (lectura) -->
  <line x1="170" y1="382" x2="170" y2="455" stroke="#0a58ca" stroke-width="1.5" stroke-dasharray="5" marker-end="url(#a)"/>
  <text x="175" y="420" font-size="9" fill="#0a58ca">read()</text>
</svg>
