<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: bold; fill: #1e293b; }
      .section-title { font-size: 14px; font-weight: bold; }
      .label { font-size: 11px; font-weight: bold; }
      .text { font-size: 10px; }
      .code { font-size: 9px; font-family: 'Courier New', 'Courier', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1100" fill="#f8fafc"/>

  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" class="title">
    Stack Frame Layout: asm_float_to_int() en x86-64
  </text>

  <!-- ============ PART 1: Stack Layout ============ -->
  <text x="50" y="70" class="section-title" fill="#2563eb">
    1. LAYOUT DE MEMORIA EN EL STACK
  </text>

  <!-- Stack memory cells -->
  <!-- 0x18(%rbp) -->
  <rect x="50" y="85" width="280" height="40" fill="#f0f9ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="70" y="107" class="label" fill="#1e40af">0x18(%rbp)</text>
  <text x="200" y="107" text-anchor="start" class="text" fill="#64748b">Siguiente parámetro</text>

  <!-- 0x10(%rbp) - TARGET (RED) -->
  <rect x="50" y="125" width="280" height="50" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="70" y="145" class="label" fill="#991b1b">0x10(%rbp) ← AQUÍ</text>
  <text x="70" y="160" class="text" fill="#7f1d1d">gini_value (float) - Parámetro 15º</text>

  <!-- 0x08(%rbp) -->
  <rect x="50" y="175" width="280" height="40" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="70" y="197" class="label" fill="#312e81">0x08(%rbp)</text>
  <text x="200" y="197" text-anchor="start" class="text" fill="#312e81">[RIP] Return address</text>

  <!-- 0x00(%rbp) -->
  <rect x="50" y="215" width="280" height="40" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="70" y="237" class="label" fill="#4c1d95">0x00(%rbp)</text>
  <text x="200" y="237" text-anchor="start" class="text" fill="#4c1d95">[RBP] Previous RBP</text>

  <!-- Arrow to RBP -->
  <line x1="340" y1="237" x2="380" y2="237" stroke="#7c3aed" stroke-width="2"/>
  <polygon points="380,237 375,234 375,240" fill="#7c3aed"/>
  <text x="390" y="242" class="text" fill="#7c3aed" font-weight="bold">%rbp points here</text>

  <!-- Arrow to gini_value -->
  <line x1="340" y1="150" x2="380" y2="150" stroke="#dc2626" stroke-width="2"/>
  <polygon points="380,150 375,147 375,153" fill="#dc2626"/>
  <text x="390" y="155" class="text" fill="#dc2626" font-weight="bold">Argument location</text>

  <!-- ============ PART 2: Registers ============ -->
  <text x="50" y="290" class="section-title" fill="#059669">
    2. REGISTROS (LLENOS POR DUMMY ARGUMENTS)
  </text>

  <!-- Integer registers box -->
  <rect x="50" y="305" width="280" height="80" fill="#d1fae5" stroke="#059669" stroke-width="2" rx="4"/>
  <text x="70" y="325" class="label" fill="#047857">Integer Registers (6/6 FULL)</text>
  <text x="70" y="345" class="text" fill="#065f46">%rdi=0  %rsi=0  %rdx=0</text>
  <text x="70" y="360" class="text" fill="#065f46">%rcx=0  %r8=0   %r9=0</text>
  <text x="70" y="375" class="text" fill="#0d9488" font-weight="bold">→ Dummy Arguments</text>

  <!-- XMM registers box -->
  <rect x="360" y="305" width="280" height="80" fill="#d1fae5" stroke="#059669" stroke-width="2" rx="4"/>
  <text x="380" y="325" class="label" fill="#047857">XMM Registers (8/8 FULL)</text>
  <text x="380" y="345" class="text" fill="#065f46">%xmm0-7: 0.0 (8 doubles)</text>
  <text x="380" y="360" class="text" fill="#065f46">Total: 8 x 8 bytes = 64 bytes</text>
  <text x="380" y="375" class="text" fill="#0d9488" font-weight="bold">→ Dummy Arguments</text>

  <!-- ============ PART 3: Offset Calculation ============ -->
  <text x="50" y="430" class="section-title" fill="#1e293b">
    3. CÁLCULO DEL OFFSET: ¿Por qué 0x10(%rbp)?
  </text>

  <!-- Calculation boxes -->
  <!-- Box 1 -->
  <rect x="50" y="445" width="140" height="70" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="4"/>
  <text x="65" y="465" class="label" fill="#1e40af">pushq %rbp</text>
  <text x="65" y="483" class="code" fill="#1e40af">RSP: 1000h</text>
  <text x="65" y="498" class="code" fill="#1e40af">→ 0FF8h</text>

  <!-- Arrow -->
  <line x1="195" y1="480" x2="210" y2="480" stroke="#333" stroke-width="2"/>
  <polygon points="210,480 205,477 205,483" fill="#333"/>

  <!-- Box 2 -->
  <rect x="210" y="445" width="140" height="70" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="4"/>
  <text x="225" y="465" class="label" fill="#166534">movq %rsp, %rbp</text>
  <text x="225" y="483" class="code" fill="#166534">RBP = 0FF8h</text>
  <text x="225" y="498" class="code" fill="#166534">new frame</text>

  <!-- Arrow -->
  <line x1="355" y1="480" x2="370" y2="480" stroke="#333" stroke-width="2"/>
  <polygon points="370,480 365,477 365,483" fill="#333"/>

  <!-- Box 3 -->
  <rect x="370" y="445" width="150" height="70" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
  <text x="385" y="465" class="label" fill="#92400e">Stack Offsets</text>
  <text x="385" y="483" class="code" fill="#92400e">RBP + 0x00: old RBP</text>
  <text x="385" y="498" class="code" fill="#92400e">RBP + 0x08: RIP</text>

  <!-- Math box -->
  <rect x="530" y="445" width="250" height="70" fill="#f8f4ff" stroke="#a855f7" stroke-width="2" rx="4"/>
  <text x="545" y="465" class="label" fill="#6b21a8">MATEMÁTICA:</text>
  <text x="545" y="483" class="code" fill="#6b21a8">0x00 (8B) + 0x08 (8B) = 0x10</text>
  <text x="545" y="500" class="code" fill="#a855f7" font-weight="bold">1st param at RBP + 0x10 ✓</text>

  <!-- ============ PART 4: Assembly Code ============ -->
  <text x="50" y="550" class="section-title" fill="#1e293b">
    4. CÓDIGO ASSEMBLY (ACCESO AL STACK)
  </text>

  <rect x="50" y="565" width="730" height="180" fill="#1e293b" stroke="#64748b" stroke-width="1" rx="4"/>

  <text x="70" y="585" class="code" fill="#22c55e" font-weight="bold">
    asm_float_to_int:
  </text>

  <text x="70" y="605" class="code" fill="#60a5fa">
    pushq   %rbp                  # Save previous RBP to stack
  </text>

  <text x="70" y="625" class="code" fill="#60a5fa">
    movq    %rsp, %rbp            # Create new stack frame
  </text>

  <text x="70" y="645" class="code" fill="#fbbf24" font-weight="bold">
    movss   0x10(%rbp), %xmm0     # ← KEY LINE: Load float from stack
  </text>

  <text x="70" y="665" class="code" fill="#60a5fa">
    cvttss2si %xmm0, %eax         # Convert float to int (truncate)
  </text>

  <text x="70" y="685" class="code" fill="#60a5fa">
    popq    %rbp                  # Restore previous RBP
  </text>

  <text x="70" y="705" class="code" fill="#60a5fa">
    ret                           # Return to caller
  </text>

  <!-- Explanation -->
  <rect x="50" y="755" width="730" height="40" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="3"/>
  <text x="70" y="780" class="text" fill="#92400e" font-weight="bold">
    movss 0x10(%rbp), %xmm0 → Reads float from address (RBP + 16 bytes)
  </text>

  <!-- ============ PART 5: Comparison ============ -->
  <text x="50" y="830" class="section-title" fill="#1e293b">
    5. COMPARACIÓN: x86 (32-bit) vs x86-64 (64-bit)
  </text>

  <!-- x86 (32-bit) box -->
  <rect x="50" y="845" width="340" height="90" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="4"/>
  <text x="70" y="865" class="label" fill="#166534">x86 (32-bit) - Clase Teórica</text>
  <text x="70" y="883" class="code" fill="#166534">push ebp              # 4 bytes</text>
  <text x="70" y="898" class="code" fill="#166534">mov  ebp, esp</text>
  <text x="70" y="913" class="code" fill="#166534">1st parameter: EBP + 8 (4+4)</text>

  <!-- x86-64 (64-bit) box -->
  <rect x="410" y="845" width="370" height="90" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" rx="4"/>
  <text x="430" y="865" class="label" fill="#1e40af">x86-64 (64-bit) - Este Proyecto</text>
  <text x="430" y="883" class="code" fill="#1e40af">pushq %rbp            # 8 bytes</text>
  <text x="430" y="898" class="code" fill="#1e40af">movq  %rsp, %rbp</text>
  <text x="430" y="913" class="code" fill="#1e40af" font-weight="bold">1st parameter: RBP + 0x10 (8+8) ✓</text>

  <!-- Summary box -->
  <rect x="50" y="955" width="730" height="110" fill="#f5f3ff" stroke="#a855f7" stroke-width="2" rx="4"/>
  <text x="70" y="975" class="label" fill="#6b21a8">RESUMEN:</text>
  <text x="70" y="993" class="text" fill="#6b21a8">
    • 6 registros enteros llenan %rdi, %rsi, %rdx, %rcx, %r8, %r9 (dummies)
  </text>
  <text x="70" y="1010" class="text" fill="#6b21a8">
    • 8 registros XMM llenan %xmm0-%xmm7 (dummies)
  </text>
  <text x="70" y="1027" class="text" fill="#6b21a8">
    • El argumento real (15º) va al STACK en 0x10(%rbp)
  </text>
  <text x="70" y="1044" class="text" fill="#6b21a8">
    • La instrucción "movss 0x10(%rbp), %xmm0" lo recupera
  </text>
</svg>
