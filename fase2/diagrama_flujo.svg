<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 920" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <linearGradient id="grad-python" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="grad-c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="grad-asm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1100" height="920" fill="#fafafa" rx="12"/>

  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Flujo de Datos: Calculadora de Indices GINI</text>
  <text x="550" y="62" text-anchor="middle" font-size="13" fill="#64748b">Python (API REST) → C (Capa Intermedia) → Assembly x86-64 (Calculos)</text>

  <!-- ==================== COLUMN: PYTHON ==================== -->
  <rect x="30" y="80" width="320" height="820" rx="10" fill="url(#grad-python)" stroke="#3b82f6" stroke-width="2"/>
  <text x="190" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563eb">PYTHON (query.py)</text>

  <!-- API Box -->
  <rect x="60" y="125" width="260" height="55" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="190" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">API Banco Mundial</text>
  <text x="190" y="168" text-anchor="middle" font-size="10" fill="#1e40af" font-family="monospace">requests.get(URL)</text>

  <!-- Parse Box -->
  <rect x="60" y="200" width="260" height="65" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="190" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Parseo JSON</text>
  <text x="190" y="240" text-anchor="middle" font-size="10" fill="#1e40af" font-family="monospace">parse_gini_data()</text>
  <text x="190" y="255" text-anchor="middle" font-size="10" fill="#1e40af">Extrae: pais, anio, gini (float)</text>

  <!-- ctypes load -->
  <rect x="60" y="285" width="260" height="55" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="190" y="307" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Cargar Libreria C</text>
  <text x="190" y="327" text-anchor="middle" font-size="10" fill="#1e40af" font-family="monospace">ctypes.CDLL('./libgini.so')</text>

  <!-- ctypes config -->
  <rect x="60" y="360" width="260" height="75" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="190" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Definir tipos ctypes</text>
  <text x="190" y="400" text-anchor="middle" font-size="9" fill="#1e40af" font-family="monospace">float_to_int: [c_float] → c_int</text>
  <text x="190" y="416" text-anchor="middle" font-size="9" fill="#1e40af" font-family="monospace">sumar_uno:    [c_int]   → c_int</text>
  <text x="190" y="430" text-anchor="middle" font-size="9" fill="#64748b">Empaqueta datos para ABI C</text>

  <!-- Call float_to_int -->
  <rect x="60" y="460" width="260" height="55" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="483" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Llamada 1</text>
  <text x="190" y="503" text-anchor="middle" font-size="11" fill="#1e40af" font-family="monospace">lib.float_to_int(42.3)</text>

  <!-- Call sumar_uno -->
  <rect x="60" y="640" width="260" height="55" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="663" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Llamada 2</text>
  <text x="190" y="683" text-anchor="middle" font-size="11" fill="#1e40af" font-family="monospace">lib.sumar_uno(42)</text>

  <!-- Result -->
  <rect x="60" y="820" width="260" height="55" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="190" y="842" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Mostrar resultado</text>
  <text x="190" y="862" text-anchor="middle" font-size="10" fill="#1e40af" font-family="monospace">print("Gini + 1: 43")</text>

  <!-- Arrows Python internal -->
  <line x1="190" y1="180" x2="190" y2="200" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="190" y1="265" x2="190" y2="285" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="190" y1="340" x2="190" y2="360" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="190" y1="435" x2="190" y2="460" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- ==================== COLUMN: C ==================== -->
  <rect x="390" y="80" width="320" height="820" rx="10" fill="url(#grad-c)" stroke="#f59e0b" stroke-width="2"/>
  <text x="550" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#b45309">C (gini.c)</text>

  <!-- float_to_int C -->
  <rect x="420" y="460" width="260" height="100" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="550" y="483" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">float_to_int(float gini)</text>
  <text x="550" y="500" text-anchor="middle" font-size="9" fill="#92400e">Recibe float en %xmm0</text>
  <text x="550" y="518" text-anchor="middle" font-size="9" fill="#92400e" font-family="monospace">asm_float_to_int(</text>
  <text x="550" y="532" text-anchor="middle" font-size="9" fill="#92400e" font-family="monospace">0,0,0,0,0,0,  ← %rdi-%r9</text>
  <text x="550" y="546" text-anchor="middle" font-size="9" fill="#92400e" font-family="monospace">0.0 x8,        ← %xmm0-7</text>
  <text x="550" y="556" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="bold" font-family="monospace">gini)           ← STACK</text>

  <!-- sumar_uno C -->
  <rect x="420" y="640" width="260" height="90" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="550" y="663" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">sumar_uno(int gini)</text>
  <text x="550" y="680" text-anchor="middle" font-size="9" fill="#92400e">Recibe int en %edi</text>
  <text x="550" y="698" text-anchor="middle" font-size="9" fill="#92400e" font-family="monospace">asm_sumar_uno(</text>
  <text x="550" y="712" text-anchor="middle" font-size="9" fill="#92400e" font-family="monospace">0,0,0,0,0,0,  ← %rdi-%r9</text>
  <text x="550" y="724" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="bold" font-family="monospace">gini)           ← STACK</text>

  <!-- Retorno labels C -->
  <rect x="420" y="580" width="260" height="35" rx="6" fill="#fef9c3" stroke="#eab308" stroke-width="1" stroke-dasharray="4"/>
  <text x="550" y="602" text-anchor="middle" font-size="11" fill="#854d0e" font-family="monospace">return %eax → 42</text>

  <rect x="420" y="755" width="260" height="35" rx="6" fill="#fef9c3" stroke="#eab308" stroke-width="1" stroke-dasharray="4"/>
  <text x="550" y="777" text-anchor="middle" font-size="11" fill="#854d0e" font-family="monospace">return %eax → 43</text>

  <!-- ==================== COLUMN: ASM ==================== -->
  <rect x="750" y="80" width="320" height="820" rx="10" fill="url(#grad-asm)" stroke="#10b981" stroke-width="2"/>
  <text x="910" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#047857">ASM x86-64 (gini_asm.s)</text>

  <!-- Stack diagram label -->
  <text x="910" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#047857">Stack Frame Layout</text>

  <!-- Stack table -->
  <rect x="790" y="155" width="240" height="25" rx="0" fill="#065f46" stroke="#047857"/>
  <text x="840" y="172" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Offset</text>
  <text x="970" y="172" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Contenido</text>

  <rect x="790" y="180" width="240" height="25" fill="#d1fae5" stroke="#a7f3d0"/>
  <text x="840" y="197" text-anchor="middle" font-size="10" fill="#065f46" font-family="monospace">0x0(%rbp)</text>
  <text x="970" y="197" text-anchor="middle" font-size="10" fill="#065f46">Viejo %rbp</text>

  <rect x="790" y="205" width="240" height="25" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="840" y="222" text-anchor="middle" font-size="10" fill="#065f46" font-family="monospace">0x8(%rbp)</text>
  <text x="970" y="222" text-anchor="middle" font-size="10" fill="#065f46">Dir. retorno</text>

  <rect x="790" y="230" width="240" height="25" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="840" y="247" text-anchor="middle" font-size="10" fill="#991b1b" font-weight="bold" font-family="monospace">0x10(%rbp)</text>
  <text x="970" y="247" text-anchor="middle" font-size="10" fill="#991b1b" font-weight="bold">PARAMETRO REAL</text>

  <!-- asm_float_to_int -->
  <rect x="780" y="460" width="260" height="130" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="910" y="483" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">asm_float_to_int</text>
  <text x="910" y="502" text-anchor="middle" font-size="10" fill="#065f46">Prologo:</text>
  <text x="910" y="518" text-anchor="middle" font-size="9" fill="#065f46" font-family="monospace">pushq  %rbp</text>
  <text x="910" y="532" text-anchor="middle" font-size="9" fill="#065f46" font-family="monospace">movq   %rsp, %rbp</text>
  <text x="910" y="550" text-anchor="middle" font-size="10" fill="#065f46">Operacion:</text>
  <text x="910" y="566" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="bold" font-family="monospace">movss 0x10(%rbp), %xmm0</text>
  <text x="910" y="580" text-anchor="middle" font-size="9" fill="#065f46" font-family="monospace">cvttss2si %xmm0, %eax</text>

  <!-- asm_sumar_uno -->
  <rect x="780" y="640" width="260" height="120" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="910" y="663" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">asm_sumar_uno</text>
  <text x="910" y="682" text-anchor="middle" font-size="10" fill="#065f46">Prologo:</text>
  <text x="910" y="698" text-anchor="middle" font-size="9" fill="#065f46" font-family="monospace">pushq  %rbp</text>
  <text x="910" y="712" text-anchor="middle" font-size="9" fill="#065f46" font-family="monospace">movq   %rsp, %rbp</text>
  <text x="910" y="730" text-anchor="middle" font-size="10" fill="#065f46">Operacion:</text>
  <text x="910" y="746" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="bold" font-family="monospace">movl 0x10(%rbp), %eax</text>
  <text x="910" y="760" text-anchor="middle" font-size="9" fill="#065f46" font-family="monospace">addl  $1, %eax</text>

  <!-- ==================== ARROWS BETWEEN COLUMNS ==================== -->

  <!-- Python -> C: float_to_int -->
  <line x1="320" y1="488" x2="418" y2="488" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="370" y="480" text-anchor="middle" font-size="9" fill="#333" font-family="monospace">42.3</text>
  <text x="370" y="500" text-anchor="middle" font-size="8" fill="#666">%xmm0</text>

  <!-- C -> ASM: float_to_int -->
  <line x1="680" y1="510" x2="778" y2="510" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="730" y="502" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="bold">STACK</text>
  <text x="730" y="520" text-anchor="middle" font-size="8" fill="#666">42.3 float</text>

  <!-- ASM -> C: return float_to_int -->
  <line x1="778" y1="570" x2="682" y2="595" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" stroke-dasharray="6"/>
  <text x="740" y="575" text-anchor="middle" font-size="9" fill="#16a34a" font-family="monospace">%eax=42</text>

  <!-- C -> Python: return float_to_int -->
  <line x1="418" y1="597" x2="322" y2="620" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" stroke-dasharray="6"/>
  <text x="370" y="600" text-anchor="middle" font-size="9" fill="#16a34a" font-family="monospace">42</text>

  <!-- Python internal: resultado float_to_int a sumar_uno -->
  <line x1="190" y1="515" x2="190" y2="640" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="178" y="580" text-anchor="end" font-size="9" fill="#2563eb">gini_int = 42</text>

  <!-- Python -> C: sumar_uno -->
  <line x1="320" y1="668" x2="418" y2="668" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="370" y="660" text-anchor="middle" font-size="9" fill="#333" font-family="monospace">42</text>
  <text x="370" y="680" text-anchor="middle" font-size="8" fill="#666">%edi</text>

  <!-- C -> ASM: sumar_uno -->
  <line x1="680" y1="688" x2="778" y2="688" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="730" y="680" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="bold">STACK</text>
  <text x="730" y="700" text-anchor="middle" font-size="8" fill="#666">42 int</text>

  <!-- ASM -> C: return sumar_uno -->
  <line x1="778" y1="745" x2="682" y2="770" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" stroke-dasharray="6"/>
  <text x="740" y="752" text-anchor="middle" font-size="9" fill="#16a34a" font-family="monospace">%eax=43</text>

  <!-- C -> Python: return sumar_uno -->
  <line x1="418" y1="772" x2="322" y2="800" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" stroke-dasharray="6"/>
  <text x="370" y="780" text-anchor="middle" font-size="9" fill="#16a34a" font-family="monospace">43</text>

  <!-- Python: sumar_uno result to print -->
  <line x1="190" y1="695" x2="190" y2="820" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="178" y="760" text-anchor="end" font-size="9" fill="#2563eb">gini_sumado = 43</text>

  <!-- ==================== LEGEND ==================== -->
  <rect x="420" y="130" width="260" height="130" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="550" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Convencion System V AMD64 ABI</text>

  <text x="440" y="172" font-size="9" fill="#334155" font-family="monospace">%rdi,%rsi,%rdx,%rcx,%r8,%r9</text>
  <text x="440" y="186" font-size="9" fill="#64748b">→ 6 primeros args enteros</text>

  <text x="440" y="204" font-size="9" fill="#334155" font-family="monospace">%xmm0 - %xmm7</text>
  <text x="440" y="218" font-size="9" fill="#64748b">→ 8 primeros args float/double</text>

  <text x="440" y="236" font-size="9" fill="#dc2626" font-weight="bold">Args extra → STACK</text>
  <text x="440" y="250" font-size="9" fill="#334155" font-family="monospace">%eax</text>
  <text x="485" y="250" font-size="9" fill="#64748b">→ valor de retorno</text>

</svg>
