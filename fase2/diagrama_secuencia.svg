<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-return" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <style>
      .actor-name { font-size: 12px; font-weight: bold; }
      .message-label { font-size: 10px; fill: #1e293b; }
      .note-text { font-size: 9px; fill: #4b5563; }
      .lifeline { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 2,2; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="950" fill="#fafafa"/>

  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">
    Diagrama de Secuencia: Fase 2 (Python → C → Assembly)
  </text>
  <text x="600" y="55" text-anchor="middle" font-size="12" fill="#64748b">
    Flujo completo de llamada con Stack Frame
  </text>

  <!-- ACTORS (Headers) -->
  <!-- Python -->
  <rect x="50" y="80" width="120" height="50" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
  <text x="110" y="107" text-anchor="middle" class="actor-name" fill="#1e40af">Python</text>

  <!-- ctypes -->
  <rect x="250" y="80" width="120" height="50" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
  <text x="310" y="107" text-anchor="middle" class="actor-name" fill="#92400e">ctypes</text>

  <!-- C Wrapper -->
  <rect x="450" y="80" width="120" height="50" fill="#fed7aa" stroke="#ea580c" stroke-width="2" rx="4"/>
  <text x="510" y="107" text-anchor="middle" class="actor-name" fill="#7c2d12">C (gini.c)</text>

  <!-- Assembly -->
  <rect x="650" y="80" width="120" height="50" fill="#d1fae5" stroke="#059669" stroke-width="2" rx="4"/>
  <text x="710" y="107" text-anchor="middle" class="actor-name" fill="#065f46">Assembly</text>

  <!-- Stack Memory -->
  <rect x="850" y="80" width="120" height="50" fill="#e9d5ff" stroke="#a855f7" stroke-width="2" rx="4"/>
  <text x="910" y="107" text-anchor="middle" class="actor-name" fill="#6b21a8">Stack</text>

  <!-- CPU -->
  <rect x="1050" y="80" width="120" height="50" fill="#fecaca" stroke="#dc2626" stroke-width="2" rx="4"/>
  <text x="1110" y="107" text-anchor="middle" class="actor-name" fill="#991b1b">Registros</text>

  <!-- LIFELINES -->
  <line x1="110" y1="130" x2="110" y2="900" class="lifeline"/>
  <line x1="310" y1="130" x2="310" y2="900" class="lifeline"/>
  <line x1="510" y1="130" x2="510" y2="900" class="lifeline"/>
  <line x1="710" y1="130" x2="710" y2="900" class="lifeline"/>
  <line x1="910" y1="130" x2="910" y2="900" class="lifeline"/>
  <line x1="1110" y1="130" x2="1110" y2="900" class="lifeline"/>

  <!-- SEQUENCE STEPS -->

  <!-- Step 1: Load library -->
  <text x="60" y="160" font-size="10" font-weight="bold" fill="#1e40af">1. Cargar librería</text>
  <line x1="110" y1="175" x2="310" y2="175" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="200" y="170" text-anchor="middle" class="message-label">ctypes.CDLL('./libgini.so')</text>

  <!-- Step 2: Call float_to_int with data -->
  <text x="60" y="220" font-size="10" font-weight="bold" fill="#1e40af">2. lib.float_to_int(42.3)</text>
  <line x1="110" y1="235" x2="310" y2="235" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="200" y="230" text-anchor="middle" class="message-label">float 42.3</text>

  <!-- Step 3: ctypes calls C wrapper -->
  <line x1="310" y1="280" x2="510" y2="280" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="275" text-anchor="middle" class="message-label">float_to_int(42.3)</text>
  <text x="60" y="280" font-size="10" font-weight="bold" fill="#92400e">3. Llamar C</text>

  <!-- Step 4: C adds dummies and calls ASM -->
  <line x1="510" y1="325" x2="710" y2="325" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="320" text-anchor="middle" class="message-label">asm_float_to_int(...dummies..., 42.3)</text>
  <text x="60" y="325" font-size="10" font-weight="bold" fill="#7c2d12">4. Agregar dummies</text>

  <!-- Note: Dummy arguments -->
  <rect x="520" y="345" width="180" height="70" fill="#fff5eb" stroke="#ea580c" stroke-width="1" stroke-dasharray="2,2" rx="3"/>
  <text x="535" y="360" font-size="9" font-weight="bold" fill="#7c2d12">Dummies agregados:</text>
  <text x="535" y="375" font-size="8" fill="#7c2d12">• 6 long (0,0,0,0,0,0) → %rdi-%r9</text>
  <text x="535" y="388" font-size="8" fill="#7c2d12">• 8 double (0.0) → %xmm0-%xmm7</text>
  <text x="535" y="401" font-size="8" fill="#ea580c" font-weight="bold">• 42.3 → STACK (0x10(%rbp))</text>

  <!-- Step 5: ASM reads from stack -->
  <line x1="710" y1="445" x2="910" y2="445" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="440" text-anchor="middle" class="message-label">movss 0x10(%rbp), %xmm0</text>
  <text x="60" y="445" font-size="10" font-weight="bold" fill="#065f46">5. Leer stack</text>

  <!-- Note: Stack layout -->
  <rect x="720" y="460" width="180" height="85" fill="#f0fdf4" stroke="#059669" stroke-width="1" stroke-dasharray="2,2" rx="3"/>
  <text x="735" y="475" font-size="9" font-weight="bold" fill="#065f46">Stack layout:</text>
  <text x="735" y="490" font-size="8" fill="#065f46">0x00(%rbp) = RBP anterior</text>
  <text x="735" y="503" font-size="8" fill="#065f46">0x08(%rbp) = RIP</text>
  <text x="735" y="516" font-size="8" fill="#059669" font-weight="bold">0x10(%rbp) = 42.3 ✓</text>

  <!-- Step 6: Convert float to int -->
  <line x1="710" y1="580" x2="1110" y2="580" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="900" y="575" text-anchor="middle" class="message-label">cvttss2si %xmm0, %eax</text>
  <text x="60" y="580" font-size="10" font-weight="bold" fill="#065f46">6. Convertir</text>

  <!-- Registers update -->
  <rect x="1000" y="595" width="220" height="55" fill="#fee2e2" stroke="#dc2626" stroke-width="1" rx="3"/>
  <text x="1015" y="610" font-size="9" font-weight="bold" fill="#991b1b">%eax = 42 (truncado)</text>
  <text x="1015" y="625" font-size="8" fill="#7f1d1d">Conversión completa</text>

  <!-- Step 7: ASM cleanup and return -->
  <line x1="710" y1="685" x2="710" y2="705" stroke="#059669" stroke-width="1"/>
  <text x="720" y="695" font-size="9" fill="#065f46">popq %rbp</text>
  <text x="720" y="710" font-size="9" fill="#065f46">ret</text>

  <!-- Step 8: Return to C -->
  <line x1="710" y1="730" x2="510" y2="730" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow-return)"/>
  <text x="600" y="725" text-anchor="middle" class="message-label">retorno: %eax = 42</text>
  <text x="60" y="730" font-size="10" font-weight="bold" fill="#7c2d12">7. Retorno</text>

  <!-- Step 9: C returns to ctypes -->
  <line x1="510" y1="775" x2="310" y2="775" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow-return)"/>
  <text x="400" y="770" text-anchor="middle" class="message-label">int 42</text>

  <!-- Step 10: ctypes returns to Python -->
  <line x1="310" y1="820" x2="110" y2="820" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow-return)"/>
  <text x="200" y="815" text-anchor="middle" class="message-label">PyObject(42)</text>
  <text x="60" y="820" font-size="10" font-weight="bold" fill="#1e40af">8. Resultado</text>

  <!-- Final result box -->
  <rect x="40" y="850" width="500" height="70" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
  <text x="60" y="870" font-size="11" font-weight="bold" fill="#1e40af">RESULTADO FINAL:</text>
  <text x="60" y="888" font-size="10" fill="#1e40af">Input (Python):  42.3 (float)</text>
  <text x="60" y="905" font-size="10" fill="#1e40af">Output (Python): 42 (int) ← Convertido en Assembly</text>
</svg>
